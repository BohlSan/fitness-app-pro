<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HIT App</title>
  <link rel="stylesheet" href="/css/styles.css?v=5">
</head>
<body>
  <main class="pantalla">
    <h1>Bienvenido a HIT App</h1>
    <p class="subtitulo">Prepárate para conseguir tu mejor versión</p>
    <button class="boton" disabled title="Próximamente">Registrarse con Google</button>
    <a class="boton" href="/seleccion-perfil.html">Registrarse con Mail</a>
    <a class="boton secundario" href="/login.html">Iniciar sesión</a>
  </main>
  <script src="/js/api.js?v=4"></script>
  <script>
    // Si ya hay sesión iniciada, ir directo al destino que corresponda
    (async () => {
      if (!obtenerToken()) return;
      try {
        await irAlDestino(obtenerUsuario());
      } catch (e) {
        // si algo falla, la persona se queda en la landing
      }
    })();
  </script>
</body>
</html>
