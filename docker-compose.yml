services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: fitness
      POSTGRES_PASSWORD: fitness
      POSTGRES_DB: fitness
    volumes:
      - fitness_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fitness -d fitness"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      # 5433 en la máquina para no chocar con un PostgreSQL local; opcional, sirve para mirar la base con un cliente
      - "5433:5432"
    restart: unless-stopped

  app:
    build: .
    image: fitness-app:latest
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Apunta a la base del compose, no a Supabase (por eso no se usa env_file)
      DATABASE_URL: postgresql+psycopg://fitness:fitness@db:5432/fitness
      SECRET_KEY: ${SECRET_KEY:-clave-solo-para-desarrollo-cambiar-en-produccion}
    ports:
      - "8000:8000"
    # Crea las tablas que falten y carga el catálogo (ambos scripts se pueden repetir) antes de arrancar
    command:
      - sh
      - -c
      - >-
        python -m scripts.create_tables &&
        python -m scripts.seed_ejercicios &&
        exec uvicorn app.main:app --host 0.0.0.0 --port 8000
    restart: unless-stopped

volumes:
  fitness_pgdata: